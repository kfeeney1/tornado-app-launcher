name: Android Bootstrap

on:
  push:
    branches: [work-block-2-android-foundation-clean]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work-block-2-android-foundation-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Build shared web app
        run: npm run build
      - name: Generate native Android project
        run: npx cap add android
      - name: Commit generated foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(android): generate native Capacitor project"
          git push origin HEAD:work-block-2-android-foundation-clean
