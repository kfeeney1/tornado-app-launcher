appId: ie.tornado.launcher
productName: Tornado
electronVersion: 44.3.0
asar: true
directories:
  output: release
files:
  - dist/**/*
  - electron/main/**/*
  - electron/preload/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Tornado
artifactName: Tornado-Setup-${version}.${ext}
