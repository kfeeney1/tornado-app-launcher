name: Android Foundation Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Android foundation configuration
        run: node --test tests/android-build-foundation.test.mjs
