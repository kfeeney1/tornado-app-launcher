name: Android Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Lint shared code
        run: npm run lint -- --max-warnings=0
      - name: Run Android contract tests
        run: node --test tests/android-*.test.mjs tests/firebase-runtime.test.mjs
      - name: Build shared web app
        run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify debug APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tornado-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
