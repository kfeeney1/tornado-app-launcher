name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: node --check functions/index.js
      - run: node --test tests/unit/*.test.mjs
      - run: npm run desktop:test
      - run: npm run build
      - run: npx --yes firebase-tools@latest emulators:exec --project demo-tornado-app-launcher --only auth,firestore "node --test tests/firestore-rules.test.mjs"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:test
      - run: npm run desktop:build
      - name: Smoke packaged Tornado
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path release -Filter 'Tornado-*.exe' | Select-Object -First 1
          if (-not $package) { throw 'Packaged Tornado executable was not produced.' }

          $started = Start-Process -FilePath $package.FullName -PassThru
          Start-Sleep -Seconds 10

          $running = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like 'Tornado*' })
          if ($started.HasExited -and $running.Count -eq 0) {
            throw "Packaged Tornado exited during startup with code $($started.ExitCode)."
          }

          foreach ($process in $running) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
          if (-not $started.HasExited) {
            Stop-Process -Id $started.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: tornado-windows-phase-7
          path: release/*.exe
          if-no-files-found: error
