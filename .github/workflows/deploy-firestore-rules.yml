name: Deploy Firestore Rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/unit/*.test.mjs
      - run: npx --yes firebase-tools@latest emulators:exec --project demo-tornado-app-launcher --only auth,firestore "node --test tests/firestore-rules.test.mjs"
      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TORNADO_APP_LAUNCHER }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools@latest deploy --project tornado-app-launcher --only firestore:rules
