name: Phase D Bootstrap
on:
  push:
    branches: [phase-d-android-app-game-launching]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-d-android-app-game-launching
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android
          git commit -m "build(android): sync App Launcher plugin" || exit 0
          git push origin HEAD:phase-d-android-app-game-launching
